name: Release

on:
  workflow_dispatch:
    inputs:
      publish_cli:
        description: "Publish CLI package to npm"
        required: false
        type: boolean
        default: false
      release_windows:
        description: "Release for Windows"
        required: false
        type: boolean
        default: false
      release_macos:
        description: "Release for macOS"
        required: false
        type: boolean
        default: false
      release_ubuntu:
        description: "Release for Ubuntu"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determine-matrix:
    name: Determine release platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set
        env:
          RELEASE_WINDOWS: ${{ inputs.release_windows }}
          RELEASE_MACOS: ${{ inputs.release_macos }}
          RELEASE_UBUNTU: ${{ inputs.release_ubuntu }}
        run: |
          python -c '
          import json, os
          platforms = []
          if os.environ.get("RELEASE_WINDOWS") == "true":
              platforms.append({"os":"windows-latest","bundles":"nsis","uploadUpdaterJson":True})
          if os.environ.get("RELEASE_MACOS") == "true":
              platforms.append({"os":"macos-latest","bundles":"app,dmg","uploadUpdaterJson":False})
          if os.environ.get("RELEASE_UBUNTU") == "true":
              platforms.append({"os":"ubuntu-latest","bundles":"deb,appimage","uploadUpdaterJson":False})
          if not platforms:
              print("No release platforms selected", flush=True)
              raise SystemExit(1)
          matrix = {"include": platforms}
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps(matrix) + "\n")
          '

  verify:
    name: Verify version
    needs: determine-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Verify synchronized stable version
        run: |
          packageVersion=$(jq -r .version package.json)
          tauriVersion=$(jq -r .version src-tauri/tauri.conf.json)
          cargoVersion=$(grep -m1 '^version = "' src-tauri/Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          cliVersion=$(jq -r .version packages/snipdock-cli/package.json)
          if [ "$packageVersion" != "$tauriVersion" ] || [ "$packageVersion" != "$cargoVersion" ] || [ "$packageVersion" != "$cliVersion" ]; then
            echo "Version mismatch: package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion cli=$cliVersion" >&2
            exit 1
          fi
          if ! echo "$packageVersion" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release version must match X.Y.Z; got $packageVersion" >&2
            exit 1
          fi
      - run: bun test
      - run: bun run lint

  release:
    name: Release (${{ matrix.os }})
    needs: [determine-matrix, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.determine-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux bundle dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Collect release notes
        id: notes
        shell: bash
        run: |
          VERSION=$(jq -r .version package.json)
          BODY=$(awk -v tag="## [$VERSION]" '
            index($0, tag) == 1 { collecting = 1; next }
            collecting && index($0, "## [") == 1 { exit }
            collecting { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            BODY="See the commit history for what changed in v$VERSION."
          fi
          {
            echo 'body<<RELEASE_NOTES_EOF'
            echo "$BODY"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - id: tauri-action
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: SnipDock v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: ${{ matrix.uploadUpdaterJson }}
          args: --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json
      - name: Build standalone binary
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.tauri-action.outputs.releaseId }}
          uploadUpdaterJson: false
          args: --no-bundle
      - name: Upload standalone binary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version package.json)
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BINARY_PATH="src-tauri/target/release/SnipDock.exe"
            BINARY_NAME="snipdock_windows_x86_64.exe"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            BINARY_PATH="src-tauri/target/release/SnipDock"
            BINARY_NAME="snipdock_macos_aarch64"
          else
            BINARY_PATH="src-tauri/target/release/snipdock"
            BINARY_NAME="snipdock_linux_x86_64"
          fi
          if [ -f "$BINARY_PATH" ]; then
            gzip -c "$BINARY_PATH" > "${BINARY_NAME}.gz"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${BINARY_NAME}.gz" > "${BINARY_NAME}.gz.sha256"
            else
              shasum -a 256 "${BINARY_NAME}.gz" > "${BINARY_NAME}.gz.sha256"
            fi
            gh release upload "v$VERSION" "${BINARY_NAME}.gz" "${BINARY_NAME}.gz.sha256" --clobber
          fi
      # tauri-action writes updater URLs as `api.github.com/.../releases/
      # assets/<id>`, which addresses the installer by asset id. The standalone
      # build above runs tauri-action a second time against the same release,
      # which re-uploads the bundle and mints a new asset id - leaving the
      # manifest pointing at an asset that no longer exists. The updater then
      # finds the new version, shows its notes, and dies on
      # `Download request failed with status: 404 Not Found`, which is exactly
      # what shipped in v0.1.19.
      #
      # Browser download URLs address the file by name, so they survive a
      # re-upload. Rewriting them here, after every upload is done, is what
      # makes the manifest outlive the assets it points at.
      - name: Pin updater URLs to stable download links
        if: matrix.uploadUpdaterJson
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version package.json)
          gh release download "v$VERSION" --pattern latest.json --output latest.json --clobber
          gh api "repos/${{ github.repository }}/releases/tags/v$VERSION" --jq '[.assets[].name]' > assets.json

          INSTALLER=$(jq -r '.[] | select(endswith("-setup.exe"))' assets.json | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "No -setup.exe on the release; refusing to publish a manifest that cannot resolve." >&2
            exit 1
          fi

          URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/$INSTALLER"
          # A HEAD that does not come back 200 means the manifest would ship
          # broken again; fail the release rather than the user's update.
          STATUS=$(curl -sIL -o /dev/null -w '%{http_code}' "$URL")
          if [ "$STATUS" != "200" ]; then
            echo "Installer URL returned HTTP $STATUS: $URL" >&2
            exit 1
          fi

          jq --arg url "$URL" '.platforms |= with_entries(.value.url = $url)' latest.json > latest.pinned.json
          mv latest.pinned.json latest.json
          gh release upload "v$VERSION" latest.json --clobber
          echo "Updater manifest pinned to $URL"

      - name: Update legacy alpha clients
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version package.json)
          gh release download "v$VERSION" --pattern latest.json --output latest.json --clobber
          if ! gh release view updater-alpha >/dev/null 2>&1; then
            gh release create updater-alpha \
              --title "Updater manifest (legacy alpha clients)" \
              --notes "Carries the current \`latest.json\` for alpha clients that still poll this tag. Install SnipDock from the versioned releases instead." \
              --prerelease
          fi
          gh release upload updater-alpha latest.json --clobber

  publish-cli:
    name: Publish CLI to npm
    needs: release
    runs-on: ubuntu-latest
    if: success() && inputs.publish_cli == true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Update CLI version
        run: |
          VERSION=$(jq -r .version package.json)
          cd packages/snipdock-cli
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
      - name: Build CLI
        run: |
          cd packages/snipdock-cli
          bun install
          bun run build
      - name: Publish to npm
        run: |
          cd packages/snipdock-cli
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
