name: Release

on:
  workflow_dispatch:
    inputs:
      publish_cli:
        description: "Publish CLI package to npm"
        required: false
        type: boolean
        default: false
      release_windows:
        description: "Release for Windows"
        required: false
        type: boolean
        default: false
      release_macos:
        description: "Release for macOS"
        required: false
        type: boolean
        default: false
      release_ubuntu:
        description: "Release for Ubuntu"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Must be at least the bun that wrote bun.lock: an older one cannot read
      # the lockfile format and `--frozen-lockfile` then fails outright. Keep
      # this in step with `packageManager` in package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Verify synchronized stable version
        run: |
          packageVersion=$(jq -r .version package.json)
          tauriVersion=$(jq -r .version src-tauri/tauri.conf.json)
          cargoVersion=$(grep -m1 '^version = "' src-tauri/Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          cliVersion=$(jq -r .version packages/snipdock-cli/package.json)
          if [ "$packageVersion" != "$tauriVersion" ] || [ "$packageVersion" != "$cargoVersion" ] || [ "$packageVersion" != "$cliVersion" ]; then
            echo "Version mismatch: package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion cli=$cliVersion" >&2
            exit 1
          fi
          if ! echo "$packageVersion" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release version must match X.Y.Z; got $packageVersion" >&2
            exit 1
          fi
      - run: bun test
      - run: bun run lint

  release:
    name: Release (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - if: ${{ inputs.release_windows }}
            os: windows-latest
            bundles: nsis
            uploadUpdaterJson: true
          - if: ${{ inputs.release_macos }}
            os: macos-latest
            bundles: app,dmg
            uploadUpdaterJson: false
          - if: ${{ inputs.release_ubuntu }}
            os: ubuntu-latest
            bundles: deb,appimage
            uploadUpdaterJson: false
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux bundle dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      # `generateReleaseNotes` left the release body empty, so the updater
      # manifest carried `"notes": ""` and the in-app Updates panel had nothing
      # to show. Publish the CHANGELOG section for this version instead.
      - name: Collect release notes
        id: notes
        shell: bash
        run: |
          VERSION=$(jq -r .version package.json)
          # `index($0, tag) == 1` rather than a regex: the version brackets
          # would otherwise read as a character class.
          BODY=$(awk -v tag="## [$VERSION]" '
            index($0, tag) == 1 { collecting = 1; next }
            collecting && index($0, "## [") == 1 { exit }
            collecting { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            BODY="See the commit history for what changed in v$VERSION."
          fi
          {
            echo 'body<<RELEASE_NOTES_EOF'
            echo "$BODY"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - id: tauri-action
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: SnipDock v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: ${{ matrix.uploadUpdaterJson }}
          args: --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json
      # `uploadUpdaterJson` defaults to true, and this step passes no
      # `releaseBody`, so it used to rewrite the release's `latest.json` with
      # `"notes": ""` right after the bundling step had published the real
      # notes. The platform entries survived the rewrite, which is why the
      # updater still worked while the in-app dialog said no notes were
      # published. This step ships a binary, not an update -- keep it out of
      # the manifest.
      - name: Build standalone binary
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.tauri-action.outputs.releaseId }}
          uploadUpdaterJson: false
          args: --no-bundle
      - name: Upload standalone binary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version package.json)
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BINARY_PATH="src-tauri/target/release/SnipDock.exe"
            BINARY_NAME="snipdock_windows_x86_64.exe"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            BINARY_PATH="src-tauri/target/release/SnipDock"
            BINARY_NAME="snipdock_macos_aarch64"
          else
            BINARY_PATH="src-tauri/target/release/snipdock"
            BINARY_NAME="snipdock_linux_x86_64"
          fi
          if [ -f "$BINARY_PATH" ]; then
            gzip -c "$BINARY_PATH" > "${BINARY_NAME}.gz"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${BINARY_NAME}.gz" > "${BINARY_NAME}.gz.sha256"
            else
              shasum -a 256 "${BINARY_NAME}.gz" > "${BINARY_NAME}.gz.sha256"
            fi
            gh release upload "v$VERSION" "${BINARY_NAME}.gz" "${BINARY_NAME}.gz.sha256" --clobber
          fi
      - name: Update legacy alpha clients
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version package.json)
          gh release download "v$VERSION" --pattern latest.json --output latest.json --clobber
          # Legacy alpha clients poll the fixed `updater-alpha` tag rather than
          # the versioned release, and nothing else in this workflow creates it.
          # Create it on demand so a repository that has never published that
          # tag publishes the manifest instead of failing the release.
          if ! gh release view updater-alpha >/dev/null 2>&1; then
            gh release create updater-alpha \
              --title "Updater manifest (legacy alpha clients)" \
              --notes "Carries the current \`latest.json\` for alpha clients that still poll this tag. Install SnipDock from the versioned releases instead." \
              --prerelease
          fi
          gh release upload updater-alpha latest.json --clobber

  publish-cli:
    name: Publish CLI to npm
    needs: release
    runs-on: ubuntu-latest
    if: success() && inputs.publish_cli == true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Update CLI version
        run: |
          VERSION=$(jq -r .version package.json)
          cd packages/snipdock-cli
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
      - name: Build CLI
        run: |
          cd packages/snipdock-cli
          bun install
          bun run build
      - name: Publish to npm
        run: |
          cd packages/snipdock-cli
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
