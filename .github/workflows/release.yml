name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify synchronized stable version
        run: |
          packageVersion=$(jq -r .version package.json)
          tauriVersion=$(jq -r .version src-tauri/tauri.conf.json)
          cargoVersion=$(grep -m1 '^version = "' src-tauri/Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          if [ "$packageVersion" != "$tauriVersion" ] || [ "$packageVersion" != "$cargoVersion" ]; then
            echo "Version mismatch: package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion" >&2
            exit 1
          fi
          if ! echo "$packageVersion" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release version must match X.Y.Z; got $packageVersion" >&2
            exit 1
          fi
      - run: bun test
      - run: bun run lint

  release:
    name: Release (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            uploadUpdaterJson: true
          - os: macos-latest
            bundles: app,dmg
            uploadUpdaterJson: false
          - os: ubuntu-latest
            bundles: deb,appimage
            uploadUpdaterJson: false
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux bundle dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: SnipDock v__VERSION__
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: ${{ matrix.uploadUpdaterJson }}
          args: --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json
      - name: Update legacy alpha clients
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $manifest = Join-Path $env:RUNNER_TEMP "latest.json"
          gh release download "v$version" --pattern latest.json --output $manifest
          gh release upload updater-alpha $manifest --clobber
