name: Feature request
description: Propose a focused improvement to SnipDock.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should be solved?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the smallest useful outcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What existing workflows or simpler options did you try?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Note affected screens, commands, data, or platform behavior.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and did not find this request.
          required: true
