[package]
name = "snipdock"
version = "0.1.20"
description = "Offline clipboard and snippet manager"
edition = "2021"

[lib]
name = "snipdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5"
base64 = "0.23"
chacha20poly1305 = "0.11"
chrono = "0.4"
getrandom = "0.4"
png = "0.18"
regex = "1"
# Signed uploads to S3 and R2 run in Rust: the webview CSP blocks outbound
# network calls, and the secret key must never reach the frontend.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tiny_http = "0.12"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

# Cargo's release defaults leave a lot on the table for a tray app that is
# resident all day: sixteen codegen units, no cross-crate inlining, and full
# debug symbols in the shipped binary. `opt-level = "s"` rather than 3 because
# the hot paths here are a half-second poll and SQLite queries -- neither is
# throughput-bound, and the smaller binary means less to page in and a smaller
# installer to download on every update.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# No `panic = "abort"`. The clipboard monitor runs on its own thread and the
# code around it is written to survive a poisoned mutex rather than take the
# process down with it, which only holds while panics unwind.

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
